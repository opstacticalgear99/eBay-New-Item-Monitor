name: eBay hourly new-item monitor

on:
 schedule:
   - cron: "17 * * * *"
 workflow_dispatch:

permissions:
 contents: write

concurrency:
 group: ebay-new-item-monitor
 cancel-in-progress: false

jobs:
 monitor:
   runs-on: ubuntu-24.04
   timeout-minutes: 10

   steps:
     - name: Check out repository
       uses: actions/checkout@v5

     - name: Set up Python
       uses: actions/setup-python@v6
       with:
         python-version: "3.12"

     - name: Install dependencies
       run: python -m pip install --upgrade pip requests

     - name: Run monitor
       env:
         EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
         EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
         GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
         GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
         ALERT_TO: ${{ secrets.ALERT_TO }}
         EBAY_MARKETPLACE_ID: EBAY_US
       run: python monitor.py

     - name: Save de-duplication state
       run: |
         if [ -f seen_items.json ]; then
           git config user.name "github-actions[bot]"
           git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
           git add seen_items.json
           if ! git diff --cached --quiet; then
             git commit -m "Update monitored eBay item IDs"
             git push
           fi
         fi
