name: FieldWatch eBay and website monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebay-new-item-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show beautifulsoup4
          python -c "from bs4 import BeautifulSoup; print('BeautifulSoup import OK')"

      - name: Run monitor
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          APP_API_URL: ${{ secrets.APP_API_URL }}
          APP_API_TOKEN: ${{ secrets.APP_API_TOKEN }}
          EBAY_MARKETPLACE_ID: EBAY_US
        run: python monitor.py

      - name: Run website new-product and restock monitors
        if: ${{ !cancelled() }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          APP_API_URL: ${{ secrets.APP_API_URL }}
          APP_API_TOKEN: ${{ secrets.APP_API_TOKEN }}
        run: python website_monitor.py

      - name: Save de-duplication state
        if: ${{ !cancelled() }}
        run: |
          if [ -f seen_items.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_items.json
            for state in ronin_state.json forward_state.json website_settings_cache.json; do
              if [ -f "$state" ]; then git add "$state"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Update monitor baselines and notification state"
              for attempt in 1 2 3; do
                if git push; then exit 0; fi
                git pull --rebase
              done
              exit 1
            fi
          fi
